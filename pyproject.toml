[project]
name = "gulf-data-mcp"
version = "0.1.0"
description = "MCP server with live Gulf & Middle East data (Dubai DLD property transactions, Gulf jobs, gold prices, Amazon/Noon products) plus web search and web-to-Markdown for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Get Anything", email = "get.anything2026@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "dubai", "uae", "saudi", "real-estate", "jobs", "gold-price", "amazon", "apify", "web-scraping", "rag"]
dependencies = ["mcp>=2.3", "httpx>=0.27"]

[project.urls]
Homepage = "https://getanything-site.vercel.app"
Repository = "https://github.com/GetAnything-1/gulf-data-mcp"

[project.scripts]
gulf-data-mcp = "gulf_data_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gulf_data_mcp"]
